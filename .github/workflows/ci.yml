name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the requirements and the test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      # -ra lists any skipped test with its reason at the end of the log.
      - name: Run the tests
        run: python -m pytest -ra

  dbt:
    name: dbt parse and compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dbt with the Snowflake adapter
        run: python -m pip install dbt-snowflake

      # nba_dbt/ci/profiles.yml holds placeholder values only. Neither command
      # connects to a warehouse.
      - name: Parse the project
        run: dbt parse --project-dir nba_dbt --profiles-dir nba_dbt/ci

      - name: Compile the models and tests
        run: dbt compile --project-dir nba_dbt --profiles-dir nba_dbt/ci --no-populate-cache --no-introspect

  web:
    name: Web app lint, type check, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nba-predictions-app
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install the dependencies from the lock file
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check the types
        run: npm run typecheck

      - name: Run the unit tests
        run: npm test

      # The build needs no key and no other setting.
      - name: Build
        run: npm run build

      # The page reads files that the pipeline publishes. Its bundle must not
      # name the odds provider, hold a request that carries a key, or hold one
      # of the variables that Vercel adds to a build.
      - name: Check that the build holds no trace of the odds provider
        run: |
          test -f dist/index.html
          if grep -rEo 'apiKey=|the-odds-api|VITE_VERCEL_' dist; then
            echo "::error::The built files contain the text listed above."
            exit 1
          fi

      # VITE_SPORTS_API_KEY held the API key when the page still asked the
      # provider itself, and the Vercel project may still define it. Vite can
      # copy such a variable into the bundle, so this builds with a dummy
      # value and looks for it in the output.
      - name: Build with a dummy key in the environment and check that it is not in the output
        env:
          VITE_SPORTS_API_KEY: dummy-key-that-must-not-be-bundled
        run: |
          npm run build
          test -f dist/index.html
          if grep -rFo -- "$VITE_SPORTS_API_KEY" dist; then
            echo "::error::The value of VITE_SPORTS_API_KEY is in the built files."
            exit 1
          fi
